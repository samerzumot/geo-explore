[tool.poetry]
name = "geoextract"
version = "0.1.0"
description = "Open-Source Geological Report Data Extraction System"
authors = ["GeoExtract Team <team@geoextract.org>"]
readme = "README.md"
packages = [{include = "geoextract"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
streamlit = "^1.28.1"
typer = {extras = ["all"], version = "^0.9.0"}
paddleocr = "^2.7.3"
pytesseract = "^0.3.10"
pdf2image = "^1.16.3"
pypdf = "^3.17.4"
opencv-python = "^4.8.1.78"
pillow = "^10.1.0"
ollama = "^0.1.7"
openai = "^1.3.7"
spacy = "^3.7.2"
geopandas = "^0.14.1"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
celery = {extras = ["redis"], version = "^5.3.4"}
redis = "^5.0.1"
sqlalchemy = "^2.0.23"
alembic = "^1.13.1"
folium = "^0.15.0"
pandas = "^2.1.4"
numpy = "^1.25.2"
shapely = "^2.0.2"
fiona = "^1.9.5"
pyproj = "^3.6.1"
requests = "^2.31.0"
aiofiles = "^23.2.1"
python-multipart = "^0.0.6"
python-dotenv = "^1.0.0"
rich = "^13.7.0"
click = "^8.1.7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^23.11.0"
isort = "^5.12.0"
mypy = "^1.7.1"
pre-commit = "^3.6.0"
jupyter = "^1.0.0"
ipykernel = "^6.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["geoextract"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=geoextract --cov-report=html --cov-report=term-missing"